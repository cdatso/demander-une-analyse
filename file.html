<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>File des demandes d'analyse</title>
<!--
  file.html -- la file publique du service "Demander une analyse".
  Prototype d'apprentissage BKL-FOR-006 (fiche A de l'atelier AI-Shift du
  26/08/2026).

  Cette page lit LA VUE public.demandes_publiques, en LECTURE SEULE, avec
  la clef PUBLIABLE. Elle ne lit JAMAIS la table demandes : la table
  porte les colonnes mail et motif, qui ne sont pas publiables, elle
  n'a aucune policy, et depuis le 16/09/2026 (BKL-CIN-096 lot 0, script
  03) la clef publiable n'y a plus AUCUN droit : une lecture directe rend
  une erreur de droit (42501), et non plus une liste vide.

  ZERO RESSOURCE EXTERNE : aucune feuille de style distante, aucun script
  tiers, aucune police distante.

  DEPUIS LE 19/09/2026 (BKL-CIN-098 lot S bis), CETTE PAGE PORTE UN LIEN
  VERS DU CONTENU NON RELU : la rubrique "Publiees a l'essai (non
  relues)" renvoie aux pages de la surface d'essai pilote.cdatso.be. Sur
  decision d'AH du 19/09 ("je retiens A avec B et D"), l'arbitrage A6 du
  16/09 -- surface pilote "non indexee, NON LIEE" -- est AMENDE : la
  surface reste non indexee et marquee, et devient liee depuis DEUX
  points, ici et la porte du site. Le risque est nomme au RISKLOG, R-030.
  Le lien n'apparait qu'apres un geste d'AH (etape + adresse) et sous la
  double garde de carte() ; la chaine pilote, elle, n'ecrit jamais en
  base.

  DEPUIS LE 26/09/2026 (BKL-CIN-099), UN SECOND LIEN, VERS DU CONTENU
  RELU : chaque carte "Traitees" peut porter le lien vers la page de son
  analyse sur le site de production www.cdatso.be. Meme facture que le
  lien d'essai : l'adresse est posee par AH seul (page privee, ou bloc
  R-2 de supabase/07-page-production.sql), bornee EN BASE en forme et en
  coherence, et rejouee ici sous DOUBLE garde (etape 'traitee' ET forme)
  avant qu'un lien soit cree.

  Le texte affiche au visiteur est du CONTENU : francais accentue. Le
  CODE reste en ASCII pur.

  Fichier SERVI par un serveur : UTF-8 SANS BOM (derogation nommee du
  mandat rubrique 6).
-->
<style>
  :root {
    --encre: #1c1a17;
    --encre-douce: #5b544c;
    --fond: #faf8f5;
    --carte: #ffffff;
    --trait: #ddd6cc;
    --accent: #6b4f2a;
    --alerte: #8a3d2c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fond);
    color: var(--encre);
    font: 16px/1.6 Georgia, "Times New Roman", serif;
    padding: 2.5rem 1.2rem 4rem;
  }
  main { max-width: 48rem; margin: 0 auto; }
  h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 1rem; font-weight: 600; }
  .chapeau { color: var(--encre-douce); margin: 0 0 2rem; }
  h2 {
    font-size: 1.15rem;
    margin: 2.2rem 0 0.2rem;
    padding-bottom: 0.3rem;
    border-bottom: 1px solid var(--trait);
  }
  .compte { color: var(--encre-douce); font-size: 0.85rem; font-weight: 400; }
  .vide { color: var(--encre-douce); font-style: italic; font-size: 0.92rem; margin: 0.6rem 0 0; }
  ul { list-style: none; padding: 0; margin: 0.8rem 0 0; }
  li {
    background: var(--carte);
    border: 1px solid var(--trait);
    border-radius: 4px;
    padding: 0.9rem 1rem;
    margin-bottom: 0.6rem;
  }
  .titre { font-weight: 600; }
  .meta { color: var(--encre-douce); font-size: 0.9rem; }
  .facettes { font-size: 0.88rem; margin-top: 0.4rem; }
  .facette {
    display: inline-block;
    border: 1px solid var(--trait);
    border-radius: 999px;
    padding: 0.05rem 0.55rem;
    margin: 0.15rem 0.3rem 0.15rem 0;
    color: var(--accent);
  }
  .lien-essai { margin-top: 0.5rem; font-size: 0.92rem; }
  .lien-essai a { color: var(--accent); }
  .lien-production { margin-top: 0.5rem; font-size: 0.92rem; }
  .lien-production a { color: var(--accent); font-weight: 600; }
  #message {
    border-left: 3px solid var(--alerte);
    background: var(--carte);
    padding: 1rem 1.1rem;
    margin: 0 0 1.5rem;
  }
  #message[hidden] { display: none; }
  #message p { margin: 0 0 0.5rem; }
  #message p:last-child { margin-bottom: 0; }
  code {
    font-family: Consolas, "Courier New", monospace;
    font-size: 0.88em;
    background: var(--fond);
    padding: 0.05rem 0.3rem;
    border: 1px solid var(--trait);
    border-radius: 3px;
  }
  footer { margin-top: 3rem; font-size: 0.85rem; color: var(--encre-douce); }
</style>
</head>
<body>
<main>

  <h1>File des demandes</h1>

  <p class="chapeau">Les demandes reçues par le formulaire, classées par
  étape. Les adresses électroniques et les textes libres des demandeurs
  n'apparaissent pas ici. L'arbitrage est humain : rien ne change d'étape
  tout seul.</p>

  <div id="message" hidden></div>
  <div id="sections"></div>

  <footer>
    <p>Service du site Analyses de films — www.cdatso.be. Lecture seule.</p>
  </footer>

</main>

<script>
// Code en ASCII pur (mandat rubrique 6). Les phrases affichees au
// visiteur sont du CONTENU : elles sont en francais accentue.
(function () {
  'use strict';

  // =====================================================================
  //  DEUX EMPLACEMENTS A REMPLIR -- ILS SONT VOLONTAIREMENT VIDES.
  // =====================================================================
  //  La session qui a prepare ce depot ne detient AUCUNE clef et n'en a
  //  demande aucune (arbitrage AH n.10). Les deux valeurs ci-dessous sont
  //  posees PAR AH, au test en ligne, puis committees et redeployees.
  //
  //  SUPABASE_URL
  //    Ou la trouver : Supabase -> Project Settings -> API -> Project URL.
  //    Forme : "https://<reference-du-projet>.supabase.co" (sans barre
  //    oblique finale).
  //
  //  SUPABASE_CLE_PUBLIABLE
  //    Ou la trouver : Supabase -> Project Settings -> API keys -> la clef
  //    PUBLIABLE (sb_publishable_...). C'est bien celle-la, et son role
  //    EST d'etre exposee dans une page.
  //    N'y mettez JAMAIS la clef secrete (sb_secret_...) : elle contourne
  //    la RLS par son role, et elle donnerait a n'importe quel visiteur
  //    l'acces aux colonnes mail et motif. La clef secrete vit dans les
  //    variables d'environnement Netlify, et nulle part ailleurs.
  // =====================================================================

  var SUPABASE_URL = 'https://xflbhrtuukyoihqqeoau.supabase.co';
  var SUPABASE_CLE_PUBLIABLE = 'sb_publishable_p1S5BYDF4W2KOvOcSvxRQQ_15W0dDx5';

  // ---------------------------------------------------------------------
  // Les HUIT etapes. Les six premieres viennent de l'ancienne file
  // d'attente interne, dont elles etaient le calque (arbitrage AH n.4).
  // La septieme, publication_pilote (A10 et Q2, 16/09/2026), suit
  // a_traiter : posee par AH seul, elle autorise une publication
  // automatique NON RELUE sur la SURFACE PILOTE SEULEMENT -- jamais un
  // gate de production. Une etape sans demande s'affiche quand meme,
  // vide : la file se lit d'un coup d'oeil.
  //
  // LA HUITIEME, publiee_pilote (BKL-CIN-098 lot S bis, 19/09/2026), suit
  // publication_pilote. Elle existe parce que la rubrique "Traitees"
  // MENTAIT : une demande publiee sur la surface d'essai -- non relue,
  // noindex, hors du site -- y etait rangee faute d'une etape propre
  // (cadrage du 19/09, conception "A avec B"). C'est une etape de
  // CONSTAT : AH a vu la page et en a donne l'adresse. Elle n'arme rien.
  // "Essai de publication automatique" reste la file d'attente, SANS
  // lien ; c'est cette rubrique-ci, et elle seule, qui en porte un.
  // ---------------------------------------------------------------------
  var ETAPES = [
    { cle: 'proposee',     titre: 'Proposées', note: 'Reçues par le formulaire, en attente d’arbitrage.' },
    { cle: 'a_traiter',    titre: 'À traiter', note: 'Retenues pour analyse.' },
    { cle: 'publication_pilote', titre: 'Essai de publication automatique', note: 'Retenues pour un essai hors du site, non relu.' },
    { cle: 'publiee_pilote', titre: 'Publiées à l’essai (non relues)', note: 'Produites et publiées automatiquement, sans relecture humaine, sur une surface d’essai non référencée.' },
    { cle: 'scholar',      titre: 'File d’étude', note: 'Traitement supervisé, volet avancé.' },
    { cle: 'candidat',     titre: 'Candidats', note: 'Repérées, à valider.' },
    { cle: 'mise_de_cote', titre: 'Mises de côté', note: 'Non retenues pour l’instant.' },
    { cle: 'traitee',      titre: 'Traitées', note: 'Analysées et publiées.' }
  ];

  // ---------------------------------------------------------------------
  // LA FORME D'UNE ADRESSE DE PAGE D'ESSAI -- DEFENSE EN PROFONDEUR.
  // ---------------------------------------------------------------------
  // L'EXPRESSION CI-DESSOUS EST LA MEME, CARACTERE POUR CARACTERE, qu'en
  // base (supabase/06-statut-publiee-pilote.sql, contrainte
  // demandes_page_pilote_forme_check) et que dans admin.html. Si l'une
  // des trois change, les trois changent : sinon cette page afficherait
  // un lien que la base refuserait, ou l'inverse. La passe D de
  // outils/controler-proprete.mjs compare les trois textes.
  //
  // C'est la BASE qui refuse ; cette page ne lui fait pas confiance pour
  // autant -- elle affiche un lien a un VISITEUR, et un lien affiche sur
  // une page publique ne doit jamais pouvoir etre arbitraire.
  //
  // POURQUOI String.raw ET NON UN LITTERAL D'EXPRESSION REGULIERE : dans
  // un litteral /.../ les barres obliques s'ecrivent echappees (\/), et
  // le texte cesserait d'etre identique a celui du SQL. Dans une chaine
  // ordinaire, '\.' vaut '.' -- l'echappement du point serait PERDU et
  // 'piloteXcdatsoYbe' passerait. String.raw garde le texte tel quel.
  //
  // LE CAS QU'IL FAUT CONNAITRE : une adresse valide SUIVIE D'UN SAUT DE
  // LIGNE. JavaScript sans l'indicateur 'm' fait apparier '$' a la fin de
  // chaine seulement, et la REFUSE donc -- comme PostgreSQL, et a la
  // difference de Python. Mesure : passe D, cas 12.
  var FORME_PAGE_PILOTE_TEXTE =
    String.raw`^https://pilote\.cdatso\.be/films/[a-z0-9]+(-[a-z0-9]+)*\.html$`;
  var FORME_PAGE_PILOTE = new RegExp(FORME_PAGE_PILOTE_TEXTE);

  // ---------------------------------------------------------------------
  // LA FORME D'UNE ADRESSE DE PRODUCTION (BKL-CIN-099, 26/09/2026).
  // ---------------------------------------------------------------------
  // MEME REGLE QUE CI-DESSUS, POUR LE SITE DE PRODUCTION : l'expression
  // est la meme, caractere pour caractere, qu'en base
  // (supabase/07-page-production.sql, contrainte
  // demandes_page_production_forme_check) et que dans admin.html. La passe
  // D de outils/controler-proprete.mjs compare les trois textes et juge
  // en JavaScript les quatorze cas de l'epreuve P-6 (a) -- adresse du
  // PILOTE, forme sans 'www' et saut de ligne final compris : tous
  // REFUSES.
  var FORME_PAGE_PRODUCTION_TEXTE =
    String.raw`^https://www\.cdatso\.be/analyses-de-films/films/[a-z0-9]+(-[a-z0-9]+)*\.html$`;
  var FORME_PAGE_PRODUCTION = new RegExp(FORME_PAGE_PRODUCTION_TEXTE);

  var zoneMessage = document.getElementById('message');
  var zoneSections = document.getElementById('sections');

  function message(phrases, morceauxCode) {
    zoneMessage.textContent = '';
    for (var i = 0; i < phrases.length; i++) {
      var p = document.createElement('p');
      p.textContent = phrases[i];
      zoneMessage.appendChild(p);
    }
    if (morceauxCode) {
      for (var j = 0; j < morceauxCode.length; j++) {
        var q = document.createElement('p');
        var c = document.createElement('code');
        c.textContent = morceauxCode[j];
        q.appendChild(c);
        zoneMessage.appendChild(q);
      }
    }
    zoneMessage.hidden = false;
  }

  // FAIL-CLOSED : emplacements vides => un message CLAIR, jamais une page
  // blanche, et aucune requete tentee.
  if (SUPABASE_URL === '' || SUPABASE_CLE_PUBLIABLE === '') {
    message([
      'Configuration absente : cette page n’a pas encore reçu l’adresse du ' +
      'projet et la clé publiable.',
      'Ce n’est pas une panne — les deux emplacements sont laissés vides à ' +
      'dessein, et se remplissent en tête du script de cette page :'
    ], ['SUPABASE_URL', 'SUPABASE_CLE_PUBLIABLE']);
    return;
  }

  function texte(valeur) {
    return (valeur === null || valeur === undefined) ? '' : String(valeur);
  }

  // Toujours par textContent, jamais par innerHTML : le contenu vient de
  // la base, ou il a ete ecrit par un inconnu -- il n'est jamais
  // interprete comme du balisage.
  function carte(demande) {
    var li = document.createElement('li');

    var ligneTitre = document.createElement('div');
    ligneTitre.className = 'titre';
    ligneTitre.textContent = texte(demande.titre) || '(sans titre)';
    li.appendChild(ligneTitre);

    var morceaux = [];
    if (texte(demande.realisateur)) morceaux.push(texte(demande.realisateur));
    if (demande.annee) morceaux.push(String(demande.annee));
    if (texte(demande.created_at)) morceaux.push('reçue le ' + texte(demande.created_at).slice(0, 10));
    var meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = morceaux.join(' · ');
    li.appendChild(meta);

    var q = demande.qualification;
    if (q && typeof q === 'object') {
      var facettes = [];
      if (q.volet) facettes.push('volet : ' + texte(q.volet));
      if (q.genreBase) facettes.push('genre : ' + texte(q.genreBase));
      if (q.difficulte) facettes.push('difficulté : ' + texte(q.difficulte));
      if (Array.isArray(q.sources_probables)) {
        for (var i = 0; i < q.sources_probables.length; i++) {
          facettes.push(texte(q.sources_probables[i]));
        }
      }
      if (facettes.length > 0) {
        var zone = document.createElement('div');
        zone.className = 'facettes';
        for (var j = 0; j < facettes.length; j++) {
          var span = document.createElement('span');
          span.className = 'facette';
          span.textContent = facettes[j];
          zone.appendChild(span);
        }
        li.appendChild(zone);
      }
    }

    // -------------------------------------------------------------------
    // LE LIEN VERS LA PAGE D'ESSAI -- SOUS DOUBLE GARDE, ET SEULEMENT LA.
    // -------------------------------------------------------------------
    // DEUX CONDITIONS, et il faut les deux :
    //   (1) l'etape est EXACTEMENT 'publiee_pilote' -- aucune autre
    //       rubrique ne porte de lien, "Essai de publication automatique"
    //       pas davantage ;
    //   (2) l'adresse est une CHAINE qui passe l'expression de forme, la
    //       meme qu'en base.
    // Une adresse qui ne passe pas la garde ne produit PAS de lien, et
    // rien d'autre ne casse : la carte s'affiche, sans lien. On n'affiche
    // jamais une adresse non conforme, meme en texte -- ce serait donner
    // a lire ce qu'on refuse de lier.
    //
    // createElement + href + textContent, jamais innerHTML : l'adresse
    // vient de la base. rel="noopener noreferrer" par principe, alors
    // meme que le lien s'ouvre dans l'onglet courant.
    if (demande.statut === 'publiee_pilote' &&
        typeof demande.page_pilote === 'string' &&
        FORME_PAGE_PILOTE.test(demande.page_pilote)) {
      var zoneLien = document.createElement('div');
      zoneLien.className = 'lien-essai';
      var lien = document.createElement('a');
      lien.href = demande.page_pilote;
      lien.rel = 'noopener noreferrer';
      lien.textContent = 'Lire la page d’essai (non relue)';
      zoneLien.appendChild(lien);
      li.appendChild(zoneLien);
    }

    // -------------------------------------------------------------------
    // LE LIEN VERS L'ANALYSE PUBLIEE AU SITE -- SOUS DOUBLE GARDE AUSSI.
    // -------------------------------------------------------------------
    // (1) l'etape est EXACTEMENT 'traitee' -- la rubrique "Traitees"
    //     ("Analysees et publiees") et elle seule ;
    // (2) l'adresse est une CHAINE qui passe l'expression de production,
    //     la meme qu'en base.
    // Une 'traitee' sans adresse -- ou dont l'adresse ne passe pas la
    // garde -- s'affiche SANS lien, et rien d'autre ne casse. La base
    // admet une 'traitee' sans adresse (borne a sens unique).
    //
    // Une carte 'traitee' peut garder aussi son adresse d'ESSAI
    // (page_pilote : memoire de l'adoption) : elle n'est PAS liee ici --
    // le lien d'essai n'existe que sous 'publiee_pilote', ci-dessus.
    if (demande.statut === 'traitee' &&
        typeof demande.page_production === 'string' &&
        FORME_PAGE_PRODUCTION.test(demande.page_production)) {
      var zoneProd = document.createElement('div');
      zoneProd.className = 'lien-production';
      var lienProd = document.createElement('a');
      lienProd.href = demande.page_production;
      lienProd.rel = 'noopener noreferrer';
      lienProd.textContent = 'Lire l’analyse';
      zoneProd.appendChild(lienProd);
      li.appendChild(zoneProd);
    }

    return li;
  }

  function rendre(demandes) {
    zoneSections.textContent = '';
    for (var i = 0; i < ETAPES.length; i++) {
      var etape = ETAPES[i];
      var lot = demandes.filter(function (d) { return d.statut === etape.cle; });

      var h2 = document.createElement('h2');
      h2.textContent = etape.titre + ' ';
      var compte = document.createElement('span');
      compte.className = 'compte';
      compte.textContent = '(' + lot.length + ')';
      h2.appendChild(compte);
      zoneSections.appendChild(h2);

      var note = document.createElement('p');
      note.className = 'vide';
      note.textContent = etape.note;
      zoneSections.appendChild(note);

      if (lot.length === 0) continue;
      var ul = document.createElement('ul');
      for (var j = 0; j < lot.length; j++) ul.appendChild(carte(lot[j]));
      zoneSections.appendChild(ul);
    }

    var inconnues = demandes.filter(function (d) {
      for (var k = 0; k < ETAPES.length; k++) if (ETAPES[k].cle === d.statut) return false;
      return true;
    });
    if (inconnues.length > 0) {
      message(['Attention : ' + inconnues.length + ' demande(s) portent une étape ' +
               'inconnue de cette page. Rien n’est perdu, mais elles ne sont pas affichées.']);
    }
  }

  var adresse = SUPABASE_URL.replace(/\/+$/, '') +
    '/rest/v1/demandes_publiques?select=*&order=created_at.desc';

  fetch(adresse, {
    method: 'GET',
    headers: {
      apikey: SUPABASE_CLE_PUBLIABLE,
      authorization: 'Bearer ' + SUPABASE_CLE_PUBLIABLE,
      accept: 'application/json'
    }
  }).then(function (reponse) {
    if (!reponse.ok) throw new Error('HTTP ' + reponse.status);
    return reponse.json();
  }).then(function (lignes) {
    if (!Array.isArray(lignes)) throw new Error('reponse inattendue');
    rendre(lignes);
  }).catch(function (erreur) {
    message([
      'La file n’a pas pu être lue.',
      'Cela peut venir de l’adresse du projet, de la clé publiable, ou du ' +
      'fait que la vue publique n’existe pas encore. Détail technique :',
      String(erreur && erreur.message ? erreur.message : erreur)
    ]);
  });
})();
</script>
</body>
</html>
