# netlify.toml -- demander-une-analyse (prototype d'apprentissage BKL-FOR-006).
#
# AUCUN 'schedule' ici, et c'est voulu : qualifier n'est PAS une fonction
# planifiee. C'est un ENDPOINT HTTP, appele par le formulaire d'index.html.
# Une function synchrone Netlify est plafonnee a 60 secondes (les 30
# secondes de la fiche C sont le plafond des fonctions PLANIFIEES) et la
# charge utile tamponnee a 6 Mo -- la validation d'entree de la function
# borne le corps bien en dessous.
#
# AUCUNE commande de build : le site est statique (index.html, file.html)
# plus une function. Netlify installe lui-meme la dependance de
# package.json au build.
#
# qualifier.mjs DECLARE desormais un 'path' dans son config exporte : la
# doc Netlify du rate limiting (verifiee le 25/08/2026, maj 30/07/2026)
# l'exige pour que 'rateLimit' s'applique. Ce path est fixe LITTERALEMENT
# a l'adresse PAR DEFAUT de la function,
#   /.netlify/functions/qualifier
# -- la doc du routage confirme qu'un path egal a l'adresse par defaut est
# redondant et ne change RIEN pour l'appelant. index.html continue donc
# d'appeler cette meme adresse, en relatif, sans aucun changement.
#
# Fichier destine a une MACHINE : UTF-8 SANS BOM (derogation nommee du
# mandat rubrique 6).

[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
